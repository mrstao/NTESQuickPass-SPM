name: Publish SPM version tag

on:
  push:
    branches:
      - main
    paths:
      - UPSTREAM.json

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create immutable SPM tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c '
          import json
          data = json.load(open("UPSTREAM.json", encoding="utf-8"))
          print(next(
              source["tag"] for source in data["sources"]
              if source["repository"] == "https://github.com/yidun/NTESQuickPass"
          ))
          ')"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid upstream version: $VERSION"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists. Refusing to move or overwrite an immutable SPM tag."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "NTESQuickPass-SPM $VERSION"
          git push origin "$VERSION"
          echo "Published SPM tag $VERSION"
